name: daily-report

on:
  schedule:
    # 09:00 KST, Tue–Sat (KRX publishes the previous trading day next morning). Cron is UTC.
    - cron: "0 0 * * 2-6"
  workflow_dispatch:
    inputs:
      date:
        description: "YYYYMMDD (비우면 가장 최근 영업일)"
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-report
  cancel-in-progress: false

env:
  # Raw KRX data is kept in the Actions cache, never committed (KRX terms restrict redistribution).
  DATA_CACHE_PREFIX: krx-data-v1-
  HISTORY_YEARS: 3

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install .

      - name: Restore raw data
        uses: actions/cache/restore@v4
        with:
          path: data
          key: ${{ env.DATA_CACHE_PREFIX }}${{ github.run_id }}
          restore-keys: ${{ env.DATA_CACHE_PREFIX }}

      - name: Fill in missing ETF history (full download only when the cache is empty)
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: |
          START=$(TZ=Asia/Seoul date -d "$HISTORY_YEARS years ago" +%Y%m%d)
          END=$(TZ=Asia/Seoul date -d "yesterday" +%Y%m%d)
          python -m krxreport backfill --start "$START" --end "$END" --kinds etf

      - name: Build report
        id: run
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            python -m krxreport daily --date "$INPUT_DATE"
          else
            python -m krxreport daily
          fi

      - name: Save raw data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: ${{ env.DATA_CACHE_PREFIX }}${{ github.run_id }}

      - name: Commit report
        if: steps.run.outputs.status == 'ok'
        env:
          REPORT_DATE: ${{ steps.run.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports docs summary.csv
          git commit -m "report: $REPORT_DATE"
          # other commits may have landed while this ran
          git pull --rebase origin main
          git push

      - name: Post report as an Issue (set repo variable CREATE_ISSUE=true to enable)
        if: steps.run.outputs.status == 'ok' && vars.CREATE_ISSUE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_DATE: ${{ steps.run.outputs.date }}
          REPORT_FILE: ${{ steps.run.outputs.report }}
        run: |
          gh label create daily-report --color 0E8A16 --force
          gh issue create --title "📊 KRX 리포트 $REPORT_DATE" --body-file "$REPORT_FILE" --label daily-report

      - name: Open an Issue when something breaks
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -f quality_error.md ]; then cp quality_error.md body.md; else echo "## 워크플로 실패" > body.md; fi
          printf '\n실행 로그: %s\n' "$RUN_URL" >> body.md
          gh label create data-quality --color D93F0B --force
          gh issue create --title "⚠️ 리포트 실패 $(date -u +%F)" --body-file body.md --label data-quality
